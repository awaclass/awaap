{% load humanize %}
{% load time %}
{% include 'header.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <title>Video Feed</title>

  <style>

    /* ══════════════════════════════════════════════════
       PAGE LAYOUT
    ══════════════════════════════════════════════════ */
    .awaClass-feed-page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }
     @media (min-width: 768px) {
      .awaClass-feed-page {
      margin-left: 50px;
    }
  }

    /* ══════════════════════════════════════════════════
       UPLOAD FORM  (superuser only)
    ══════════════════════════════════════════════════ */
    .awaClass-upload-section {
      margin-bottom: 32px;
    }
    .awaClass-section-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--awaClass-text, #0f0f0f);
      margin: 0 0 14px;
    }

    .awaClass-upload-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 560px;
    }

    .awaClass-form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--awaClass-text, #0f0f0f);
      margin-bottom: 4px;
      display: block;
    }

    .awaClass-form-field {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--awaClass-text, #0f0f0f);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--awaClass-border, #e5e5e5);
      border-radius: 0;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.18s;
    }
    .awaClass-form-field:focus {
      border-bottom-color: var(--awaClass-text, #0f0f0f);
    }
    .awaClass-form-field::placeholder { color: #a8a29e; }

    textarea.awaClass-form-field {
      resize: vertical;
      min-height: 72px;
    }

    .awaClass-form-file {
      font-size: 13px;
      color: var(--awaClass-text-light, #606060);
    }

    .awaClass-form-actions {
      display: flex;
      justify-content: flex-end;
      padding-top: 4px;
    }

    .awaClass-btn-submit {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      background: var(--awaClass-primary, #f97316);
      color: #fff;
      border: none;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .awaClass-btn-submit:hover { background: var(--awaClass-primary-dk, #ea6c0a); }

    /* ══════════════════════════════════════════════════
       CUSTOM TOAST ALERT
    ══════════════════════════════════════════════════ */
    .awa-toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .awa-toast {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: #fff;
      border: 1px solid var(--awaClass-border, #e5e5e5);
      border-left: 4px solid #e5e5e5;
      border-radius: 10px;
      min-width: 280px;
      max-width: 360px;
      pointer-events: all;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      animation: awa-toast-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      position: relative;
      overflow: hidden;
    }
    .awa-toast.hiding {
      animation: awa-toast-out 0.25s ease forwards;
    }

    /* Colour variants */
    .awa-toast--success { border-left-color: #22c55e; }
    .awa-toast--error   { border-left-color: #ef4444; }
    .awa-toast--info    { border-left-color: #f97316; }
    .awa-toast--warning { border-left-color: #f59e0b; }

    .awa-toast__icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 15px;
    }
    .awa-toast--success .awa-toast__icon { background: #dcfce7; color: #16a34a; }
    .awa-toast--error   .awa-toast__icon { background: #fee2e2; color: #dc2626; }
    .awa-toast--info    .awa-toast__icon { background: #ffedd5; color: #f97316; }
    .awa-toast--warning .awa-toast__icon { background: #fef3c7; color: #d97706; }

    .awa-toast__body {
      flex: 1;
      min-width: 0;
    }
    .awa-toast__title {
      font-size: 13px;
      font-weight: 700;
      color: #0f0f0f;
      margin: 0 0 2px;
    }
    .awa-toast__msg {
      font-size: 13px;
      color: #606060;
      margin: 0;
      line-height: 1.4;
    }

    .awa-toast__close {
      background: none;
      border: none;
      cursor: pointer;
      color: #a8a29e;
      font-size: 14px;
      padding: 2px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .awa-toast__close:hover { color: #0f0f0f; }

    /* Progress bar */
    .awa-toast__progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: #e5e5e5;
      border-radius: 0 0 10px 10px;
      overflow: hidden;
    }
    .awa-toast__progress-bar {
      height: 100%;
      width: 100%;
      transform-origin: left;
      animation: awa-progress 4s linear forwards;
    }
    .awa-toast--success .awa-toast__progress-bar { background: #22c55e; }
    .awa-toast--error   .awa-toast__progress-bar { background: #ef4444; }
    .awa-toast--info    .awa-toast__progress-bar { background: #f97316; }
    .awa-toast--warning .awa-toast__progress-bar { background: #f59e0b; }

    @keyframes awa-toast-in {
      from { opacity: 0; transform: translateX(40px) scale(0.96); }
      to   { opacity: 1; transform: translateX(0)    scale(1);    }
    }
    @keyframes awa-toast-out {
      from { opacity: 1; transform: translateX(0)    scale(1);    }
      to   { opacity: 0; transform: translateX(40px) scale(0.96); }
    }
    @keyframes awa-progress {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }

    @media (max-width: 480px) {
      .awa-toast-container {
        top: auto;
        bottom: 20px;
        right: 12px;
        left: 12px;
      }
      .awa-toast {
        min-width: unset;
        max-width: unset;
        width: 100%;
      }
    }

  </style>
</head>
<body>

{% include 'sidebar.html' %}

<!-- ══════════════════════════════════════════
     CUSTOM TOAST ALERTS
══════════════════════════════════════════ -->
<div class="awa-toast-container" id="awaToastContainer"></div>

{% if messages %}
<script>
  /* Render Django messages as toasts after DOM is ready */
  document.addEventListener('DOMContentLoaded', function () {
    const msgs = [
      {% for message in messages %}
      {
        tags: "{{ message.tags }}",
        text: "{{ message|escapejs }}"
      }{% if not forloop.last %},{% endif %}
      {% endfor %}
    ];

    const iconMap = {
      success: { cls: 'awa-toast--success', icon: 'fa-circle-check',      label: 'Success'  },
      error:   { cls: 'awa-toast--error',   icon: 'fa-circle-xmark',      label: 'Error'    },
      warning: { cls: 'awa-toast--warning', icon: 'fa-triangle-exclamation', label: 'Warning' },
      info:    { cls: 'awa-toast--info',    icon: 'fa-circle-info',        label: 'Info'     },
    };

    msgs.forEach(function (m, i) {
      /* pick the right variant; fall back to info */
      let variant = 'info';
      if (m.tags.includes('success')) variant = 'success';
      else if (m.tags.includes('error'))   variant = 'error';
      else if (m.tags.includes('warning')) variant = 'warning';
      const cfg = iconMap[variant];

      setTimeout(function () {
        showAwaToast(m.text, cfg);
      }, i * 200);
    });
  });

  function showAwaToast(message, cfg) {
    const container = document.getElementById('awaToastContainer');

    const toast = document.createElement('div');
    toast.className = 'awa-toast ' + cfg.cls;
    toast.innerHTML = `
      <div class="awa-toast__icon"><i class="fa-solid ${cfg.icon}"></i></div>
      <div class="awa-toast__body">
        <p class="awa-toast__title">${cfg.label}</p>
        <p class="awa-toast__msg">${message}</p>
      </div>
      <button class="awa-toast__close" aria-label="Dismiss"><i class="fa-solid fa-xmark"></i></button>
      <div class="awa-toast__progress"><div class="awa-toast__progress-bar"></div></div>
    `;

    container.appendChild(toast);

    /* Close on button click */
    toast.querySelector('.awa-toast__close').addEventListener('click', function () {
      dismissToast(toast);
    });

    /* Auto-dismiss after 4 s */
    const timer = setTimeout(function () { dismissToast(toast); }, 4000);

    /* Pause progress on hover */
    toast.addEventListener('mouseenter', function () {
      clearTimeout(timer);
      toast.querySelector('.awa-toast__progress-bar').style.animationPlayState = 'paused';
    });
    toast.addEventListener('mouseleave', function () {
      toast.querySelector('.awa-toast__progress-bar').style.animationPlayState = 'running';
      setTimeout(function () { dismissToast(toast); }, 1500);
    });
  }

  function dismissToast(toast) {
    if (toast.classList.contains('hiding')) return;
    toast.classList.add('hiding');
    toast.addEventListener('animationend', function () { toast.remove(); }, { once: true });
  }
</script>
{% endif %}

<div class="awaClass-feed-page">

  <!-- ══════════════════════════════════════════
       UPLOAD FORM
  ══════════════════════════════════════════ -->
  <div class="awaClass-upload-section">
    <h2 class="awaClass-section-title">Upload New Video</h2>
    <form method="post" enctype="multipart/form-data" class="awaClass-upload-form">
      {% csrf_token %}

      <div>
        <label class="awaClass-form-label" for="title">Title</label>
        <input class="awaClass-form-field" type="text" name="title" id="title" placeholder="Enter video title" required>
      </div>

      <div>
        <label class="awaClass-form-label" for="video">Video File</label>
        <input class="awaClass-form-file" type="file" name="video" id="video" accept="video/*" required>
      </div>

      <div>
        <label class="awaClass-form-label" for="about">Description <span style="font-weight:400;color:#a8a29e;">(max 300 characters)</span></label>
        <textarea class="awaClass-form-field" name="about" id="about" placeholder="What is this video about?"></textarea>
      </div>

      <div>
        <label class="awaClass-form-label" for="subject">Subject</label>
        <select class="awaClass-form-field" name="subject" id="subject">
          <option value="Mathematics">Mathematics</option>
          <option value="English">English</option>
          <option value="Physics">Physics</option>
          <option value="Chemistry">Chemistry</option>
          <option value="Geography">Geography</option>
          <option value="Economics">Economics</option>
          <option value="Government">Government</option>
        </select>
      </div>

      <div class="awaClass-form-actions">
        <button type="submit" class="awaClass-btn-submit">
          <i class="fa-solid fa-arrow-up-from-bracket"></i> Post Video
        </button>
      </div>
    </form>
  </div>

</div>

{% include 'footer.html' %}
</body>
</html>
